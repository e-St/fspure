# Customer guide is generated by src/DocsGenerator (Scriban), not Python.
# Fragment changes surface on the next docs preview / stable release.
# This workflow only checks that the docs tool still builds and can render.
name: Docs generator check

on:
  push:
    branches: [main, master]
    paths:
      - "src/DocsGenerator/**"
      - "docs/templates/**"
      - ".devcontainer/fragments/**"
      - "scripts/docs-generate.sh"
      - ".github/workflows/generate-customer-md.yml"
  pull_request:
    paths:
      - "src/DocsGenerator/**"
      - "docs/templates/**"
      - ".devcontainer/fragments/**"
      - "scripts/docs-generate.sh"
      - ".github/workflows/generate-customer-md.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build + render preview (no commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Generate preview into _site (ephemeral)
        run: |
          set -euo pipefail
          chmod +x scripts/docs-generate.sh
          bash scripts/docs-generate.sh preview "ci-check"
          test -f _site/preview/ci-check/README.md
          test -f _site/preview/ci-check/customer.md
          echo "OK: docs generator rendered preview artifacts"
