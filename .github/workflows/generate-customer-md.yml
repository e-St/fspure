# Customer guide is generated by src/DocsGenerator (Scriban), not Python.
# Fragment changes surface on the next docs preview / stable release.
# This workflow only checks that the docs tool still builds and can render.
name: Docs generator check

on:
  push:
    branches: [main, master]
    paths:
      - "src/DocsGenerator/**"
      - "src/docs/templates/**"
      - "src/docs/human/**"
      - "src/docs/assets/**"
      - "src/devcontainer/fragments/**"
      - "flake.nix"
      - ".github/workflows/generate-customer-md.yml"
  pull_request:
    paths:
      - "src/DocsGenerator/**"
      - "src/docs/templates/**"
      - "src/docs/human/**"
      - "src/docs/assets/**"
      - "src/devcontainer/fragments/**"
      - "flake.nix"
      - ".github/workflows/generate-customer-md.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build + render preview (no commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Generate preview into .generated/site (ephemeral)
        run: |
          set -euo pipefail
          dotnet run --project src/DocsGenerator -- preview "ci-check"
          test -f .generated/site/preview/ci-check/README.md
          test -f .generated/site/preview/ci-check/customer.md
          test -f .generated/site/preview/ci-check/EXAMPLES.md
          grep -q "Why should I care?" .generated/site/preview/ci-check/README.md
          grep -q "How does it work?" .generated/site/preview/ci-check/README.md
          grep -q "How can I use it?" .generated/site/preview/ci-check/README.md
          grep -q "Traditional Setup" .generated/site/preview/ci-check/README.md
          grep -q "Agentic Setup" .generated/site/preview/ci-check/README.md
          grep -q "Agentic Setup" .generated/site/preview/ci-check/customer.md
          grep -q "https://github.com/e-St/fspure/blob/main/src/docs/EXAMPLES.md" .generated/site/preview/ci-check/README.md
          grep -q "get-started.html" .generated/site/preview/ci-check/README.md
          if grep -E -q '\]\((customer\.md|src/docs/[^)]+\.md)\)' .generated/site/preview/ci-check/README.md; then
            echo "README must not use relative repo paths that break on GitHub or the site" >&2
            grep -n -E '\]\((customer\.md|src/docs/[^)]+\.md)\)' .generated/site/preview/ci-check/README.md >&2
            exit 1
          fi
          grep -q "Real code, real labels" .generated/site/preview/ci-check/EXAMPLES.md
          grep -q "let pureAdd" .generated/site/preview/ci-check/EXAMPLES.md
          grep -q "id=\"agent-skill\"" .generated/site/preview/ci-check/get-started.html
          grep -q "Why should I care?" .generated/site/preview/ci-check/index.html
          grep -q "How does it work?" .generated/site/preview/ci-check/index.html
          grep -q "How can I use it?" .generated/site/preview/ci-check/index.html
          grep -q "Traditional Setup" .generated/site/preview/ci-check/index.html
          grep -q "Agentic Setup" .generated/site/preview/ci-check/index.html
          grep -q "Why should I care?" .generated/site/preview/ci-check/get-started.html
          grep -q "Traditional Setup" .generated/site/preview/ci-check/get-started.html
          grep -q "aria-label=\"GitHub\"" .generated/site/preview/ci-check/index.html
          grep -q "aria-label=\"Releases\"" .generated/site/preview/ci-check/index.html
          grep -q "start-pick" .generated/site/preview/ci-check/index.html
          grep -q "home.js" .generated/site/preview/ci-check/index.html
          grep -q 'id="traditional"' .generated/site/preview/ci-check/index.html
          grep -q 'id="agentic"' .generated/site/preview/ci-check/index.html
          test -f .generated/site/preview/ci-check/home.js
          if grep -q "d3" .generated/site/preview/ci-check/index.html; then
            echo "D3 must not appear on the homepage" >&2
            exit 1
          fi
          echo "OK: docs generator rendered preview artifacts under .generated/"
