name: Generate customer.md

# When shared devcontainer settings/fragments change, regenerate the end-user
# guide (docs/customer.md) from vscode-common.json and commit if needed.
#
# Source:  .devcontainer/fragments/vscode-common.json
# Script:  python3 .devcontainer/generate-customer-md.py

on:
  push:
    branches: [main, master]
    paths:
      - ".devcontainer/fragments/**"
      - ".devcontainer/generate-customer-md.py"
      - ".github/workflows/generate-customer-md.yml"
  pull_request:
    paths:
      - ".devcontainer/fragments/**"
      - ".devcontainer/generate-customer-md.py"
      - ".github/workflows/generate-customer-md.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Regenerate customer.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate customer.md
        run: python3 .devcontainer/generate-customer-md.py

      - name: Verify customer.md is up to date
        run: python3 .devcontainer/generate-customer-md.py --check

      - name: Commit and push if changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/customer.md

          if git diff --staged --quiet; then
            echo "docs/customer.md already up to date."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$PR_IS_FORK" == "true" ]]; then
            echo "::error::docs/customer.md is stale."
            echo "Run locally: python3 .devcontainer/generate-customer-md.py"
            git --no-pager diff --cached --stat
            exit 1
          fi

          git commit -m "chore(docs): regenerate docs/customer.md from devcontainer fragments"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git push origin "HEAD:${{ github.head_ref }}"
          else
            git push
          fi
          echo "Pushed regenerated docs/customer.md."
