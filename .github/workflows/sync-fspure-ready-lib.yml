# Push src/samples/fspure-ready-lib/ → https://github.com/e-St/fspure-ready-lib
#
# Always updates both satellite branches with the same tip:
#   main → customer CI (released FSharp.PureAnalyzer on nuget.org)
#   dev  → integration CI (latest from e-St GitHub Packages)
#
# Setup: src/docs/SYNC-FSPURE-READY-LIB.md  ·  secret: FSPURE_READY_LIB_PUSH_TOKEN
name: Sync fspure-ready-lib

on:
  push:
    branches: [main]
    paths:
      - "src/samples/fspure-ready-lib/**"
      - ".github/workflows/sync-fspure-ready-lib.yml"
      - "src/docs/SYNC-FSPURE-READY-LIB.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare commit but do not push"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-fspure-ready-lib
  cancel-in-progress: false

jobs:
  sync:
    name: Sync monorepo sample → e-St/fspure-ready-lib (main + dev)
    runs-on: ubuntu-latest
    if: github.repository == 'e-St/fspure'
    steps:
      - name: Checkout fspure
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Require push token
        env:
          FSPURE_READY_LIB_PUSH_TOKEN: ${{ secrets.FSPURE_READY_LIB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${FSPURE_READY_LIB_PUSH_TOKEN:-}" ]]; then
            echo "::error::Secret FSPURE_READY_LIB_PUSH_TOKEN is not set on e-St/fspure."
            echo "Create a fine-grained PAT with Contents: Write (+ Workflows: Write) on e-St/fspure-ready-lib,"
            echo "then add it as repository secret FSPURE_READY_LIB_PUSH_TOKEN."
            echo "See src/docs/SYNC-FSPURE-READY-LIB.md"
            exit 1
          fi

      - name: Clone satellite repository
        env:
          FSPURE_READY_LIB_PUSH_TOKEN: ${{ secrets.FSPURE_READY_LIB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${FSPURE_READY_LIB_PUSH_TOKEN}@github.com/e-St/fspure-ready-lib.git" \
            "$RUNNER_TEMP/fspure-ready-lib"

      - name: Update satellite working tree from monorepo sample
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/src/samples/fspure-ready-lib"
          DST="$RUNNER_TEMP/fspure-ready-lib"
          test -d "$SRC"

          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'artifacts/' \
            --exclude '**/bin/' \
            --exclude '**/obj/' \
            --exclude '**/.vs/' \
            --exclude '**/TestResults/' \
            "$SRC/" "$DST/"

          {
            echo "source_repo=e-St/fspure"
            echo "source_path=src/samples/fspure-ready-lib"
            echo "source_sha=${GITHUB_SHA}"
            echo "source_ref=${GITHUB_REF}"
            echo "synced_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "method=single-synthetic-commit"
            echo "branches=main,dev"
          } > "$DST/.fspure-sync-source"

      - name: Commit and push to main and dev
        env:
          FSPURE_READY_LIB_PUSH_TOKEN: ${{ secrets.FSPURE_READY_LIB_PUSH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        working-directory: ${{ runner.temp }}/fspure-ready-lib
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No file changes vs current satellite tip; still pushing HEAD to main and dev."
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            MSG="sync from e-St/fspure@${SHORT_SHA}

          Source: src/samples/fspure-ready-lib
          Monorepo: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          "
            git commit -m "$MSG"
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run: not pushing. HEAD:"
            git log -1 --oneline
            exit 0
          fi

          # Same tip on both branches (creates dev if it does not exist yet).
          git push origin "HEAD:main"
          echo "Pushed to e-St/fspure-ready-lib@main (customer CI / nuget.org)"

          git push origin "HEAD:dev"
          echo "Pushed to e-St/fspure-ready-lib@dev (dev CI / GitHub Packages)"
