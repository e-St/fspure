# Open a pull request on e-St/fstarter with the fspure integration pack
# (devcontainer overlay + pinned FSharp.PureAnalyzer version).
#
# Secret: FSPURE_FSTARTER_TOKEN — fine-grained PAT on e-St/fstarter with:
#   Contents: Read and write
#   Pull requests: Read and write
#
# Docs: src/docs/SYNC-FSTARTER.md
name: PR fspure updates to fstarter

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "src/scripts/integrations/fstarter/**"
      - "src/scripts/prepare-fstarter-update.sh"
      - ".github/workflows/pr-fstarter.yml"
      - "src/docs/SYNC-FSTARTER.md"
  workflow_dispatch:
    inputs:
      analyzer_version:
        description: "FSharp.PureAnalyzer version to pin (empty = versions.env or nuget.org latest stable)"
        required: false
        default: ""
      dry_run:
        description: "Prepare branch commit but do not push or open PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-fstarter
  cancel-in-progress: false

jobs:
  open-pr:
    name: Apply pack and open PR on fstarter
    runs-on: ubuntu-latest
    if: github.repository == 'e-St/fspure'
    steps:
      - name: Checkout fspure
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Require FSPURE_FSTARTER_TOKEN
        env:
          FSPURE_FSTARTER_TOKEN: ${{ secrets.FSPURE_FSTARTER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${FSPURE_FSTARTER_TOKEN:-}" ]]; then
            echo "::error::Secret FSPURE_FSTARTER_TOKEN is not set on e-St/fspure."
            echo "Create a fine-grained PAT with Contents + Pull requests write on e-St/fstarter."
            echo "See src/docs/SYNC-FSTARTER.md"
            exit 1
          fi

      - name: Resolve analyzer version
        id: ver
        run: |
          set -euo pipefail
          chmod +x src/scripts/prepare-fstarter-update.sh \
            src/scripts/integrations/fstarter/assert-overlay-contract.sh \
            src/scripts/integrations/fstarter/test-overlay-contract.sh \
            src/scripts/integrations/fstarter/overlay/.devcontainer/setup-fspure.sh
          bash src/scripts/integrations/fstarter/test-overlay-contract.sh

          # Priority: workflow input → release tag → versions.env → nuget.org latest stable
          INPUT="${{ github.event.inputs.analyzer_version }}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.ref_name }}"
            TAG="${TAG#v}"
            # Ignore collector-only style tags
            if [[ "$TAG" != fspure-collector-* ]]; then
              INPUT="${INPUT:-$TAG}"
            fi
          fi

          # Always load pack pins first so a skill/CLI pin is not dropped when
          # the analyzer version comes from a release tag or workflow input.
          # shellcheck disable=SC1091
          set -a
          source src/scripts/integrations/fstarter/versions.env
          set +a

          if [[ -n "${INPUT}" ]]; then
            VER="$INPUT"
            echo "Using explicit/release version: $VER"
          else
            VER="${FSPURE_ANALYZER_VERSION:-}"
            if [[ -z "$VER" || "$VER" == "latest" ]]; then
              VER="$(
                curl -fsSL "https://api.nuget.org/v3-flatcontainer/fsharp.pureanalyzer/index.json" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); v=[x for x in (d.get('versions') or []) if '-' not in x]; print(sorted(v, key=lambda s: tuple(int(p) for p in s.split('.')))[-1])"
              )"
            fi
            echo "Using versions.env / nuget.org: $VER"
          fi

          SKILL_REF="${FSPURE_SKILL_REF:-main}"
          CLI_RELEASE="${FSPURE_CLI_RELEASE:-fspure-latest}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "skill_ref=$SKILL_REF" >> "$GITHUB_OUTPUT"
          echo "cli_release=$CLI_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Clone fstarter
        env:
          FSPURE_FSTARTER_TOKEN: ${{ secrets.FSPURE_FSTARTER_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${FSPURE_FSTARTER_TOKEN}@github.com/e-St/fstarter.git" \
            "$RUNNER_TEMP/fstarter"

      - name: Apply integration pack
        env:
          FSPURE_ANALYZER_VERSION: ${{ steps.ver.outputs.version }}
          FSPURE_SKILL_REF: ${{ steps.ver.outputs.skill_ref }}
          FSPURE_CLI_RELEASE: ${{ steps.ver.outputs.cli_release }}
        run: |
          set -euo pipefail
          bash src/scripts/prepare-fstarter-update.sh \
            "$RUNNER_TEMP/fstarter" \
            "${{ steps.ver.outputs.version }}"

      - name: Create branch, commit, push, open PR
        env:
          FSPURE_FSTARTER_TOKEN: ${{ secrets.FSPURE_FSTARTER_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ANALYZER_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.FSPURE_FSTARTER_TOKEN }}
        working-directory: ${{ runner.temp }}/fstarter
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          SUBJECT="$(git -C "${GITHUB_WORKSPACE}" log -1 --pretty=%s 2>/dev/null || true)"
          BRANCH="fspure/sync-${ANALYZER_VERSION}-${SHORT_SHA}"

          git checkout -B "$BRANCH"
          git add -A

          if git diff --staged --quiet; then
            echo "No file changes in fstarter vs current main — nothing to PR."
            exit 0
          fi

          set +e
          DESCRIBE="$(python3 "${GITHUB_WORKSPACE}/src/scripts/describe-fstarter-pr.py" \
            --fstarter . \
            --fspure-sha "${GITHUB_SHA}" \
            --fspure-repo "${GITHUB_REPOSITORY}" \
            --server-url "${GITHUB_SERVER_URL}" \
            --run-id "${GITHUB_RUN_ID}" \
            --event "${GITHUB_EVENT_NAME}" \
            --subject "${SUBJECT}" \
            --ref-name "${GITHUB_REF_NAME}")"
          rc=$?
          set -e
          if [[ "$rc" -eq 2 ]]; then
            echo "Only .fspure-sync-source changed — no fstarter PR (nothing for a human to review)."
            exit 0
          fi
          [[ "$rc" -eq 0 ]]
          TITLE="$(printf '%s\n' "$DESCRIBE" | head -n 1)"
          BODY="$(printf '%s\n' "$DESCRIBE" | tail -n +3)"

          git commit -m "${TITLE}

          ${BODY}"

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run: not pushing. Commit:"
            git log -1 --stat
            exit 0
          fi

          git push -u origin "HEAD:${BRANCH}" --force

          EXISTING="$(gh pr list --repo e-St/fstarter --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --repo e-St/fstarter --title "$TITLE" --body "$BODY"
            echo "Updated existing PR #$EXISTING — $TITLE"
          else
            gh pr create --repo e-St/fstarter \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          fi
