# Opens a Release PR with editable version numbers + changelog drafts.
# Merge that PR to run official-release.yml.
name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      analyzer_to:
        description: "FSharp.PureAnalyzer next version (empty = patch bump)"
        required: false
        default: ""
      collector_to:
        description: "fspure-collector next version (empty = patch bump)"
        required: false
        default: ""
      extension_to:
        description: "fsharp-pure-decorations next version (empty = patch bump)"
        required: false
        default: ""
      publish_analyzer:
        description: "Publish analyzer on merge"
        type: boolean
        default: true
      publish_collector:
        description: "Publish collector on merge"
        type: boolean
        default: true
      publish_extension:
        description: "Also publish VS Code extension (Open VSX needs OVSX_PAT)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.repository == 'e-St/fspure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare pending release + changelog drafts
        env:
          ANALYZER_TO: ${{ inputs.analyzer_to }}
          COLLECTOR_TO: ${{ inputs.collector_to }}
          EXTENSION_TO: ${{ inputs.extension_to }}
          PUBLISH_ANALYZER: ${{ inputs.publish_analyzer }}
          PUBLISH_COLLECTOR: ${{ inputs.publish_collector }}
          PUBLISH_EXTENSION: ${{ inputs.publish_extension }}
          ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x src/scripts/release/*.sh
          bash src/scripts/release/prepare-release-pr.sh

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x src/scripts/release/create-release-pr.sh
          bash src/scripts/release/create-release-pr.sh
