# GitHub Packages only for fspure-collector.
#
# nuget.org Trusted Publishing is bound to a *single* workflow file name.
# This repo's policy is nuget_publish.yml — do NOT call NuGet/login from here
# (it fails with HTTP 401 "Workflow mismatch … expected nuget_publish.yml").
#
# To publish the tool to nuget.org, run:
#   Actions → Publish Pure Analyzer to nuget.org
#   (packs analyzer + fspure-collector under the trusted workflow file)
name: Publish fspure-collector tool (GitHub Packages)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tool package version (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

jobs:
  publish-gh-packages:
    name: Pack and push to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install paket
        run: |
          if ! command -v paket >/dev/null 2>&1; then
            dotnet tool install paket --tool-path "$HOME/.dotnet/tools"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Pack fspure-collector
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          cd src/fspure-collector
          if command -v paket >/dev/null 2>&1; then paket restore; else "$HOME/.dotnet/tools/paket" restore; fi
          dotnet pack fspure-collector.fsproj \
            -c Release \
            -o ./nupkgs \
            /p:Version="$VERSION" \
            /p:PackageVersion="$VERSION"
          ls -la ./nupkgs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fspure-collector-tool-nupkg
          path: src/fspure-collector/nupkgs/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages only
        run: |
          set -euo pipefail
          dotnet nuget push src/fspure-collector/nupkgs/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
          echo "Published fspure-collector ${{ github.event.inputs.version }} to GitHub Packages"
          echo "For nuget.org use workflow: Publish Pure Analyzer to nuget.org (nuget_publish.yml)"
