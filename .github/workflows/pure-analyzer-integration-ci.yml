# Phase 2 gate: referenced-assembly path resolution + pure.json analyser integration.
# Requires FSharp.Analyzers.SDK 0.35.x (locked in FSharp.PureAnalyzer/paket.dependencies).
name: Pure Analyzer Integration CI

on:
  push:
    branches: [main]
    paths:
      - "FSharp.PureAnalyzer/**"
      - "FSharp.PureAnalyzer.Tests/**"
      - "schema/**"
      - "e2e/phase1/**"
      - "fspure.slnx"
      - ".github/workflows/pure-analyzer-integration-ci.yml"
      - ".github/workflows/pure-set-composition-ci.yml"
  pull_request:
    paths:
      - "FSharp.PureAnalyzer/**"
      - "FSharp.PureAnalyzer.Tests/**"
      - "schema/**"
      - "e2e/phase1/**"
      - "fspure.slnx"
      - ".github/workflows/pure-analyzer-integration-ci.yml"
      - ".github/workflows/pure-set-composition-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  path-resolution-tests:
    name: Referenced assembly path resolution tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install paket
        run: |
          set -euo pipefail
          if ! command -v paket >/dev/null 2>&1; then
            dotnet tool install paket --tool-path "$HOME/.dotnet/tools"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Restore PureAnalyzer (paket)
        working-directory: FSharp.PureAnalyzer
        run: |
          set -euo pipefail
          if command -v paket >/dev/null 2>&1; then paket restore; else "$HOME/.dotnet/tools/paket" restore; fi

      - name: Test path resolution (ProjectReference + PackageReference)
        run: >
          dotnet test FSharp.PureAnalyzer.Tests/FSharp.PureAnalyzer.Tests.fsproj
          -c ${{ env.CONFIGURATION }}
          --verbosity normal
          --filter "FullyQualifiedName~PathResolutionTests"

  manifest-integration-tests:
    name: Pure manifest analyser integration tests
    runs-on: ubuntu-latest
    needs: path-resolution-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install paket
        run: |
          set -euo pipefail
          if ! command -v paket >/dev/null 2>&1; then
            dotnet tool install paket --tool-path "$HOME/.dotnet/tools"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Restore PureAnalyzer (paket)
        working-directory: FSharp.PureAnalyzer
        run: |
          set -euo pipefail
          if command -v paket >/dev/null 2>&1; then paket restore; else "$HOME/.dotnet/tools/paket" restore; fi

      - name: Build PureAnalyzer
        run: >
          dotnet build FSharp.PureAnalyzer/FSharp.PureAnalyzer.fsproj
          -c ${{ env.CONFIGURATION }}
          --nologo

      - name: Restore local fsharp-analyzers tool
        run: dotnet tool restore

      - name: Test composition + manifest integration
        run: >
          dotnet test FSharp.PureAnalyzer.Tests/FSharp.PureAnalyzer.Tests.fsproj
          -c ${{ env.CONFIGURATION }}
          --verbosity normal
          --filter "FullyQualifiedName~CompositionTests|FullyQualifiedName~ManifestIntegrationTests"

  e2e-customer-baseline:
    name: E2E customer baseline (foundational still green)
    runs-on: ubuntu-latest
    needs: manifest-integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install paket
        run: |
          set -euo pipefail
          if ! command -v paket >/dev/null 2>&1; then
            dotnet tool install paket --tool-path "$HOME/.dotnet/tools"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Restore tools (fsharp-analyzers)
        run: dotnet tool restore

      - name: Restore PureAnalyzer (paket)
        working-directory: FSharp.PureAnalyzer
        run: |
          set -euo pipefail
          if command -v paket >/dev/null 2>&1; then paket restore; else "$HOME/.dotnet/tools/paket" restore; fi

      - name: Run e2e phase1 baseline
        run: bash e2e/phase1/run.sh

  pure-analyzer-phase2-gate:
    name: Phase 2 gate
    runs-on: ubuntu-latest
    needs:
      - path-resolution-tests
      - manifest-integration-tests
      - e2e-customer-baseline
    steps:
      - name: Gate summary
        run: |
          echo "Phase 2 gate green:"
          echo "  - path resolution (ProjectReference + PackageReference)"
          echo "  - pure.json composition in analyser"
          echo "  - e2e customer baseline (foundational + PURE002/003 shapes)"
