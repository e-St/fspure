name: Publish Pure Analyzer to nuget.org

# Packs and publishes (Trusted Publishing / OIDC — workflow file MUST be nuget_publish.yml):
#   - FSharp.PureAnalyzer  → nuget.org + GitHub Packages + GitHub Release (v{version}, Latest)
#   - fspure-collector     → nuget.org + GitHub Packages + same GitHub Release (if enabled)
#
# nuget.org Trusted Publishing policy must list:
#   Workflow File: nuget_publish.yml
#   Environment: (empty)
#   NUGET_USER = policy *creator* username (profile name)
#
# Do not use a long-lived NUGET_API_KEY. Do not pin this job to a GitHub Environment.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "FSharp.PureAnalyzer version (e.g. 0.4.0)"
        required: false
        default: "0.4.0"
      collector_version:
        description: "fspure-collector tool version (e.g. 0.1.0). Empty = skip collector."
        required: false
        default: "0.1.0"
      publish_collector:
        description: "Also pack/publish fspure-collector"
        type: boolean
        required: false
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # NuGet Trusted Publishing (OIDC → short-lived API key)
      contents: write # attach nupkgs to GitHub Release
      packages: write # push to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            # On release, also publish collector at the same version unless disabled.
            COLLECTOR_VERSION="$VERSION"
            PUBLISH_COLLECTOR=true
          else
            VERSION="${{ github.event.inputs.version }}"
            COLLECTOR_VERSION="${{ github.event.inputs.collector_version }}"
            PUBLISH_COLLECTOR="${{ github.event.inputs.publish_collector }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "collector_version=$COLLECTOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_collector=$PUBLISH_COLLECTOR" >> "$GITHUB_OUTPUT"
          echo "nupkg=FSharp.PureAnalyzer.${VERSION}.nupkg" >> "$GITHUB_OUTPUT"
          echo "Analyzer=$VERSION collector=$COLLECTOR_VERSION publish_collector=$PUBLISH_COLLECTOR"

      - name: Require NUGET_USER for nuget.org
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER secret is not configured."
            echo "Set repository secret NUGET_USER to the nuget.org username of the Trusted Publishing policy *creator* (profile name, not email)."
            echo "Policy must allow workflow file: nuget_publish.yml (Environment empty)."
            exit 1
          fi

      - name: Install paket
        run: dotnet tool install -g paket --version 10.3.1

      - name: Pack FSharp.PureAnalyzer
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          cd FSharp.PureAnalyzer
          paket restore
          # PrepareFspurePackageTools runs on pack (fspure-collector + BuildTasks).
          dotnet pack FSharp.PureAnalyzer.fsproj \
            -c Release \
            -o ./nupkgs \
            /p:Version="$VERSION" \
            /p:PackageVersion="$VERSION"
          ls -la ./nupkgs
          # Prove Phase 3 layout before publish.
          unzip -l "./nupkgs/FSharp.PureAnalyzer.${VERSION}.nupkg" | tee /tmp/analyzer-nupkg.list
          grep -q 'build/FSharp.PureAnalyzer.targets' /tmp/analyzer-nupkg.list
          grep -qE 'tools/(fspure-collector|purity-collector)/' /tmp/analyzer-nupkg.list

      - name: Pack fspure-collector tool
        if: ${{ steps.ver.outputs.publish_collector == 'true' && steps.ver.outputs.collector_version != '' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.collector_version }}"
          cd fspure-collector
          paket restore
          dotnet pack fspure-collector.fsproj \
            -c Release \
            -o ./nupkgs \
            /p:Version="$VERSION" \
            /p:PackageVersion="$VERSION"
          ls -la ./nupkgs

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fspure-nupkgs-nuget-org
          path: |
            FSharp.PureAnalyzer/nupkgs/*.nupkg
            fspure-collector/nupkgs/*.nupkg
          if-no-files-found: error

      # Always ship GitHub Release assets (workflow_dispatch used to skip this and
      # left the Releases page stuck on an older "Latest" tag such as 0.3.2).
      - name: Ensure GitHub Release and attach nupkgs
        id: ghrel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VERSION="${VERSION#v}"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi

          NOTES="## FSharp.PureAnalyzer ${VERSION}

          Also published to **nuget.org** and GitHub Packages.

          | Artifact | Notes |
          |----------|--------|
          | \`FSharp.PureAnalyzer.${VERSION}.nupkg\` | Phase 3 layout: \`build/\` + \`tools/fspure-collector/\` + analyzers |
          | \`fspure-collector.*.nupkg\` | Optional standalone dotnet tool (same workflow) |

          Install:
          \`\`\`bash
          dotnet add package FSharp.PureAnalyzer --version ${VERSION}
          dotnet tool install -g fspure-collector
          \`\`\`
          "

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets and marking latest."
            gh release edit "$TAG" --repo "${{ github.repository }}" --latest || true
          else
            echo "Creating release $TAG from ${GITHUB_SHA}"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes "$NOTES" \
              --latest
          fi

          gh release upload "$TAG" \
            FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --repo "${{ github.repository }}" \
            --clobber

          if [[ -d fspure-collector/nupkgs ]] && compgen -G "fspure-collector/nupkgs/*.nupkg" >/dev/null; then
            gh release upload "$TAG" \
              fspure-collector/nupkgs/*.nupkg \
              --repo "${{ github.repository }}" \
              --clobber
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attached nupkgs to GitHub Release: $TAG"
          echo "URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          # Must be the Trusted Publishing policy *creator* username (not owner email).
          user: ${{ secrets.NUGET_USER }}

      - name: Publish FSharp.PureAnalyzer to nuget.org
        run: |
          set -euo pipefail
          dotnet nuget push FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "Published to nuget.org: FSharp.PureAnalyzer ${{ steps.ver.outputs.version }}"

      - name: Publish fspure-collector to nuget.org
        if: ${{ steps.ver.outputs.publish_collector == 'true' && steps.ver.outputs.collector_version != '' }}
        run: |
          set -euo pipefail
          dotnet nuget push fspure-collector/nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "Published to nuget.org: fspure-collector ${{ steps.ver.outputs.collector_version }}"

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          SRC="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "$SRC" \
            --skip-duplicate
          if [[ -d fspure-collector/nupkgs ]]; then
            dotnet nuget push fspure-collector/nupkgs/*.nupkg \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "$SRC" \
              --skip-duplicate
          fi
          echo "Published to GitHub Packages"
