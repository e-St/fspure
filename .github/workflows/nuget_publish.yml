name: Publish Pure Analyzer to nuget.org

# Packs FSharp.PureAnalyzer and publishes via Trusted Publishing (OIDC):
#   - always → nuget.org (short-lived API key from NuGet/login@v1)
#   - always → GitHub Packages (advanced / same consumer path as today)
#   - on GitHub Release events → attaches nupkg to the release
#
# Requires repository secret NUGET_USER = nuget.org username (profile name, not email).
# Do not use a long-lived NUGET_API_KEY. Do not pin this job to a GitHub Environment
# (Trusted Publishing policy Environment must stay empty).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # NuGet Trusted Publishing (OIDC → short-lived API key)
      contents: write # attach nupkg to GitHub Release
      packages: write # push to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR (devcontainer image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "nupkg=FSharp.PureAnalyzer.${VERSION}.nupkg" >> "$GITHUB_OUTPUT"

      - name: Require NUGET_USER for nuget.org
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER secret is not configured."
            echo "Set repository secret NUGET_USER to your nuget.org username (profile name, not email)."
            echo "Also configure a Trusted Publishing policy on nuget.org for workflow nuget_publish.yml (Environment empty)."
            exit 1
          fi

      - name: Pack Pure Analyzer inside the project devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            export TMPDIR="$HOME/.nuget-tmp"
            mkdir -p "$TMPDIR"
            VERSION="${{ steps.ver.outputs.version }}"
            cd FSharp.PureAnalyzer
            paket restore
            dotnet build -c Release /p:Version="$VERSION"
            dotnet pack FSharp.PureAnalyzer.fsproj \
              -c Release \
              -o ./nupkgs \
              /p:Version="$VERSION" \
              --no-build
            ls -la ./nupkgs

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-analyzer-nupkg-nuget-org
          path: FSharp.PureAnalyzer/nupkgs/*.nupkg
          if-no-files-found: error

      - name: Attach nupkg to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --clobber

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org username / profile name — not an email and not a long-lived API key
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          set -euo pipefail
          dotnet nuget push FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "Published to nuget.org: FSharp.PureAnalyzer ${{ steps.ver.outputs.version }}"

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          dotnet nuget push FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
          echo "Published to GitHub Packages"
