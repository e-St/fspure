# Commit generated Markdown to main and publish the stable static site.
# Triggered from official-release (or manually after a stable publish).
name: Docs stable

on:
  workflow_call:
    inputs:
      version:
        description: "Stable version label (e.g. 0.4.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version label (e.g. 0.4.0)"
        required: true
        type: string
      commit:
        description: "Commit generated Markdown to the current branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: docs-stable
  cancel-in-progress: false

jobs:
  generate-and-publish:
    name: Generate stable docs
    runs-on: ubuntu-latest
    if: github.repository == 'e-St/fspure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate (write repo files)
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          chmod +x scripts/docs-generate.sh
          bash scripts/docs-generate.sh stable "$VER"

      - name: Commit Markdown to branch
        if: >-
          github.event_name == 'workflow_call' ||
          github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/*.md docs/assets || true
          if git diff --staged --quiet; then
            echo "No Markdown changes to commit."
            exit 0
          fi
          git commit -m "docs: regenerate Markdown for ${{ inputs.version }} (Scriban)

          Stable channel only — templates in docs/templates/, generator in src/DocsGenerator."
          git push

      - name: Publish stable site to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          # Keep preview/* from other runs; overwrite root stable files.
          keep_files: true
          commit_message: "docs(stable): ${{ inputs.version }}"
