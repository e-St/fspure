# Generate stable Markdown + site under .generated/ (gitignored).
# Does NOT commit into the repo tree and does NOT publish fspure.net.
# fspure.net is updated only by Official release.
name: Docs stable (generate only)

on:
  workflow_call:
    inputs:
      version:
        description: "Stable version label (e.g. 0.4.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version label (e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-stable-generate
  cancel-in-progress: false

jobs:
  generate-markdown:
    name: Generate stable docs into .generated/
    runs-on: ubuntu-latest
    if: github.repository == 'e-St/fspure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate (Markdown + site under .generated/)
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          dotnet run --project src/DocsGenerator -- stable "$VER"
          test -f .generated/docs/README.md
          test -f .generated/docs/EXAMPLES.md
          test -d .generated/site

      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: docs-stable-${{ inputs.version }}
          path: .generated/site
          if-no-files-found: error
