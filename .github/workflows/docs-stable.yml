# Generate stable Markdown into the repo tree (for review / emergency use).
#
# Does NOT publish fspure.net. The custom domain is updated only by
# Official release (see official-release.yml → "Publish fspure.net").
name: Docs stable (Markdown only)

on:
  workflow_call:
    inputs:
      version:
        description: "Stable version label (e.g. 0.4.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version label (e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docs-stable-markdown
  cancel-in-progress: false

jobs:
  generate-markdown:
    name: Generate stable Markdown (no fspure.net publish)
    runs-on: ubuntu-latest
    if: github.repository == 'e-St/fspure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate (write repo files only)
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          chmod +x scripts/docs-generate.sh
          # Generate site artifacts locally but we do NOT push them to Pages here.
          bash scripts/docs-generate.sh stable "$VER"

      - name: Commit Markdown to current branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/*.md docs/assets || true
          if git diff --staged --quiet; then
            echo "No Markdown changes to commit."
            exit 0
          fi
          git commit -m "docs: regenerate Markdown for ${{ inputs.version }} (Scriban)

          Markdown only — fspure.net is updated solely by Official release."
          git push
