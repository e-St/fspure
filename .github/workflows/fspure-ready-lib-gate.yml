# Phase 4 gate (KISS): monorepo local-feed pack → embed → consumer diagnostics.
# No nuget.org analyzer, no GitHub Packages, no satellite repo.
name: Fspure Ready Lib Gate

on:
  push:
    branches: [main]
    paths:
      - "src/samples/fspure-ready-lib/**"
      - "src/FSharp.PureAnalyzer/**"
      - "src/Fspure.Embed/**"
      - "src/fspure-collector/**"
      - "src/FSharp.PureSchema/**"
      - "src/tests/FSharp.PureSchema.Tests/**"
      - "src/tests/fixtures/**"
      - "src/scripts/fspure-ready-lib-gate.sh"
      - "src/tests/e2e/ready-lib/**"
      - ".github/workflows/fspure-ready-lib-gate.yml"
  pull_request:
    paths:
      - "src/samples/fspure-ready-lib/**"
      - "src/FSharp.PureAnalyzer/**"
      - "src/Fspure.Embed/**"
      - "src/fspure-collector/**"
      - "src/FSharp.PureSchema/**"
      - "src/tests/FSharp.PureSchema.Tests/**"
      - "src/tests/fixtures/**"
      - "src/scripts/fspure-ready-lib-gate.sh"
      - "src/tests/e2e/ready-lib/**"
      - ".github/workflows/fspure-ready-lib-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  ready-lib-gate:
    name: Local-feed pack + consumer PURE00x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install paket
        run: |
          set -euo pipefail
          if ! command -v paket >/dev/null 2>&1; then
            dotnet tool install paket --tool-path "$HOME/.dotnet/tools"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Run fspure-ready-lib gate
        run: |
          set -euo pipefail
          dotnet run --project src/Fspure.Tasks -- ready-lib-gate

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fspure-ready-lib-gate
          path: |
            artifacts/local-feed/
            artifacts/fspure-ready-lib-gate/
          if-no-files-found: warn
