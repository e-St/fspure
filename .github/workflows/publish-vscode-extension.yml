name: Publish VS Code Extension

# Builds a VSIX and publishes to GitHub Releases + Open VSX.
# Skips package/publish entirely when the push did not change vscode-extension/**
# (e.g. only this workflow file changed). Manual workflow_dispatch always runs.
# Open VSX: also skips if package.json version is already published.

on:
  push:
    branches: [main, master]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/publish-vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only package/publish when extension sources actually changed
  # ---------------------------------------------------------------------------
  detect-extension-changes:
    name: Detect vscode-extension changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to package and publish
        id: gate
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual workflow_dispatch — will package and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          # New branch / first push / force-push with unknown parent
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "No usable before-sha — will package and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "before-sha not in history — will package and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED < <(git diff --name-only "$BEFORE" "$SHA" || true)
          echo "Changed files in this push:"
          printf '  %s\n' "${CHANGED[@]:-(none)}"

          if printf '%s\n' "${CHANGED[@]}" | grep -qE '^vscode-extension/'; then
            echo "vscode-extension/** changed — will package and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under vscode-extension/** — skip package/publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  package-and-release:
    name: Package and publish
    needs: detect-extension-changes
    if: needs.detect-extension-changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read extension version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "publisher=$PUBLISHER" >> "$GITHUB_OUTPUT"
          echo "tag=vscode-extension-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          echo "extensionId=${PUBLISHER}.${NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure LICENSE is packaged
        run: |
          if [[ ! -f LICENSE && -f ../LICENSE ]]; then
            cp ../LICENSE LICENSE
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-extension/${{ steps.ver.outputs.vsix }}
          if-no-files-found: error

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VSIX="${{ steps.ver.outputs.vsix }}"
          TITLE="VS Code extension ${{ steps.ver.outputs.version }}"
          EXT="${{ steps.ver.outputs.extensionId }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Automated build of **fsharp-pure-decorations** v${{ steps.ver.outputs.version }}.

          ## Install (easy / Open VSX)
          Search **F# Pure Analyzer Decorations** in VS Code / VSCodium / code-server (Open VSX), or:
          \`\`\`bash
          # VS Code with Open VSX service override, VSCodium, or code-server:
          # Extensions UI → search ${EXT}
          \`\`\`

          ## Install (advanced / GitHub)
          \`\`\`bash
          code --install-extension ${VSIX}
          \`\`\`" \
              --latest=false
          fi

          gh release upload "$TAG" "$VSIX" --clobber

          FLOAT_TAG="vscode-extension-latest"
          if ! gh release view "$FLOAT_TAG" >/dev/null 2>&1; then
            gh release create "$FLOAT_TAG" \
              --title "VS Code extension (latest)" \
              --notes "Floating release always pointing at the newest VSIX." \
              --latest=false
          fi
          gh release upload "$FLOAT_TAG" "$VSIX" --clobber

          echo "Published $VSIX to releases $TAG and $FLOAT_TAG"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "::error::OVSX_PAT secret is not configured."
            echo "Create an Open VSX access token (https://open-vsx.org/) and set repository secret OVSX_PAT."
            echo "This is the default extension registry for fspure (VS Marketplace is not used)."
            exit 1
          fi

          LOCAL_VERSION="${{ steps.ver.outputs.version }}"
          PUBLISHER="${{ steps.ver.outputs.publisher }}"
          NAME="${{ steps.ver.outputs.name }}"
          VSIX="${{ steps.ver.outputs.vsix }}"

          # Open VSX namespace casing may differ from package.json (e.g. e-st vs e-St).
          openvsx_latest() {
            local ns="$1"
            curl -fsSL "https://open-vsx.org/api/${ns}/${NAME}/latest" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('version') or '')" 2>/dev/null \
              || true
          }

          REMOTE_VERSION="$(openvsx_latest "$PUBLISHER")"
          if [[ -z "$REMOTE_VERSION" && "$PUBLISHER" == "e-st" ]]; then
            REMOTE_VERSION="$(openvsx_latest "e-St")"
          fi

          if [[ -n "$REMOTE_VERSION" && "$REMOTE_VERSION" == "$LOCAL_VERSION" ]]; then
            echo "Open VSX already has ${PUBLISHER}.${NAME}@${LOCAL_VERSION} — skip Open VSX publish."
            exit 0
          fi

          if [[ -n "$REMOTE_VERSION" ]]; then
            echo "Open VSX latest is ${REMOTE_VERSION}; publishing ${LOCAL_VERSION}."
          else
            echo "No existing Open VSX version found (or API unavailable); attempting first publish of ${LOCAL_VERSION}."
          fi

          # If a race still hits "already published", treat as success.
          set +e
          OUT="$(npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUT"
          if [[ $STATUS -eq 0 ]]; then
            echo "Published to Open VSX: ${{ steps.ver.outputs.extensionId }}@${LOCAL_VERSION}"
            exit 0
          fi
          if echo "$OUT" | grep -qiE 'already published|already exists'; then
            echo "Open VSX reports version already published — continuing gracefully."
            exit 0
          fi
          echo "::error::Open VSX publish failed."
          exit "$STATUS"
