name: Release Pure Analyzer

# Packs FSharp.PureAnalyzer and publishes:
#   - always → GitHub Packages (advanced / same as today)
#   - on GitHub Release events → attaches nupkg to the release
#
# nuget.org publishing lives in nuget_publish.yml (Trusted Publishing / OIDC).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR (devcontainer image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "nupkg=FSharp.PureAnalyzer.${VERSION}.nupkg" >> "$GITHUB_OUTPUT"

      - name: Pack Pure Analyzer inside the build devcontainer
        uses: devcontainers/ci@v0.3
        with:
          # PureAnalyzer build container — not the root fspure IDE .devcontainer
          configFile: FSharp.PureAnalyzer/.devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            export TMPDIR="$HOME/.nuget-tmp"
            mkdir -p "$TMPDIR"
            VERSION="${{ steps.ver.outputs.version }}"
            cd FSharp.PureAnalyzer
            paket restore
            dotnet build -c Release /p:Version="$VERSION"
            dotnet pack FSharp.PureAnalyzer.fsproj \
              -c Release \
              -o ./nupkgs \
              /p:Version="$VERSION" \
              --no-build
            ls -la ./nupkgs

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-analyzer-nupkg
          path: FSharp.PureAnalyzer/nupkgs/*.nupkg
          if-no-files-found: error

      - name: Attach nupkg to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --clobber

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          dotnet nuget push FSharp.PureAnalyzer/nupkgs/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
          echo "Published to GitHub Packages"
