name: Customer E2E (pure/impure labels)

# Two-phase consumer check (analyzer baseline + visual pure/impure decorations):
#
#   Phase 1 — Analyzer baseline on src/tests/e2e/customer-fixture/Program.fs
#   Phase 2 — VS Code (code-server) opens Program.fs and screenshots pure/impure labels
#
# Both phases use src/tests/e2e/phase2/.devcontainer (known-good visual e2e image), NOT the
# root IDE or FSharp.PureAnalyzer build containers — so those changes cannot
# break CI e2e.

on:
  push:
    branches: [main, master]
    paths:
      - "src/FSharp.PureAnalyzer/**"
      - "src/editor/vscode-extension/**"
      - "src/tests/e2e/**"
      - "src/devcontainer/fragments/**"
      - "src/DevcontainerGen/**"
      - ".github/workflows/e2e-customer.yml"
      - ".github/workflows/devcontainer-flavours.yml"
  pull_request:
    paths:
      - "src/FSharp.PureAnalyzer/**"
      - "src/editor/vscode-extension/**"
      - "src/tests/e2e/**"
      - "src/devcontainer/fragments/**"
      - "src/DevcontainerGen/**"
      - ".github/workflows/e2e-customer.yml"
      - ".github/workflows/devcontainer-flavours.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  generate-devcontainer-flavours:
    uses: ./.github/workflows/devcontainer-flavours.yml

  # ---------------------------------------------------------------------------
  # Phase 1: FSharp.PureAnalyzer classification baseline
  # ---------------------------------------------------------------------------
  phase1-analyzer:
    name: "Phase 1 — Analyzer baseline"
    needs: generate-devcontainer-flavours
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply generated devcontainer flavours
        uses: ./.github/actions/apply-devcontainer-flavours

      - name: Log in to GHCR (shared fstarter base image)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Phase 1 inside e2e phase2 devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: src/tests/e2e/phase2/.devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            export TMPDIR="$HOME/.nuget-tmp"
            mkdir -p "$TMPDIR"

            if command -v fsharp-analyzers >/dev/null 2>&1; then
              true
            elif [[ -f dotnet-tools.json ]] && grep -q fsharp-analyzers dotnet-tools.json; then
              dotnet tool restore
              fsharp-analyzers() { dotnet tool run fsharp-analyzers -- "$@"; }
              export -f fsharp-analyzers
            else
              mkdir -p "$HOME/.local/bin"
              dotnet tool install fsharp-analyzers --version 0.35.0 --tool-path "$HOME/.local/bin"
              export PATH="$HOME/.local/bin:$PATH"
            fi

            bash src/tests/e2e/phase1/run.sh

      - name: Upload Phase 1 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-analyzer
          path: |
            src/tests/e2e/.artifacts/phase1/**
            src/tests/e2e/.artifacts/analyzer-drop/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Phase 2: VS Code visual decorations (screenshot Program.fs)
  # ---------------------------------------------------------------------------
  phase2-visual:
    name: "Phase 2 — VS Code screenshots"
    needs: [generate-devcontainer-flavours, phase1-analyzer]
    runs-on: ubuntu-latest
    # Screenshots are always uploaded; job fails if labels never appear.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply generated devcontainer flavours
        uses: ./.github/actions/apply-devcontainer-flavours

      - name: Log in to GHCR (shared fstarter base image)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Phase 2 inside e2e phase2 devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: src/tests/e2e/phase2/.devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            export TMPDIR="$HOME/.nuget-tmp"
            mkdir -p "$TMPDIR"
            export CODE_SERVER_HOST=127.0.0.1
            export CODE_SERVER_PORT=8080
            export WAIT_MS=180000
            bash src/tests/e2e/phase2/run.sh

      - name: Upload Phase 2 screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-visual-screenshots
          path: |
            src/tests/e2e/.artifacts/phase2/**/*.png
            src/tests/e2e/.artifacts/phase2/**/*.json
            src/tests/e2e/.artifacts/phase2/**/*.log
            src/tests/e2e/.artifacts/phase2/**/*.vsix
          if-no-files-found: ignore
