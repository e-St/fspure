name: Generate devcontainer.json

# When shared fragments or the generator change, regenerate configs under
# .generated/devcontainer/ and materialize the root Codespaces entry.
#
# Source of truth: src/devcontainer/fragments/
# Generator:       dotnet run --project src/DevcontainerGen --
#
# Only the root .devcontainer/devcontainer.json (platform entry) is committed.
# Nested / CI flavours live under .generated/ (gitignored) and are produced in CI.

on:
  push:
    branches: [main, master]
    paths:
      - "src/devcontainer/fragments/**"
      - "src/DevcontainerGen/**"
      - ".github/workflows/generate-devcontainers.yml"
  pull_request:
    paths:
      - "src/devcontainer/fragments/**"
      - "src/DevcontainerGen/**"
      - ".github/workflows/generate-devcontainers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Regenerate devcontainer flavours
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate devcontainer.json files
        run: dotnet run --project src/DevcontainerGen --

      - name: Verify outputs match generator
        run: dotnet run --project src/DevcontainerGen -- --check

      - name: Commit root Codespaces entry if changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the platform Codespaces entry is committed.
          git add .devcontainer/devcontainer.json

          if git diff --staged --quiet; then
            echo "Root .devcontainer/devcontainer.json already up to date."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$PR_IS_FORK" == "true" ]]; then
            echo "::error::Root .devcontainer/devcontainer.json is stale."
            echo "Run locally: dotnet run --project src/DevcontainerGen --"
            echo "Then commit .devcontainer/devcontainer.json"
            git --no-pager diff --cached --stat
            exit 1
          fi

          git commit -m "chore(devcontainer): regenerate root Codespaces config from fragments"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git push origin "HEAD:${{ github.head_ref }}"
          else
            git push
          fi
          echo "Pushed regenerated root .devcontainer/devcontainer.json."
