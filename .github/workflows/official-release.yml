# Runs when a Release PR (edits under src/docs/releases/) is merged to main.
# Publishes selected components, applies pins, syncs committed generated Markdown
# (README.md + src/docs/EXAMPLES.md) from human files, publishes fspure.net,
# triggers satellite syncs.
name: Official release

on:
  pull_request:
    types: [closed]
    paths:
      - "src/docs/releases/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to run from current main manifest pending (dangerous)"
        required: true
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish from src/docs/releases/manifest.json pending
    runs-on: ubuntu-latest
    if: |
      github.repository == 'e-St/fspure' && (
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — require pending release
        id: guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          out = os.environ["GITHUB_OUTPUT"]
          m = json.load(open("src/docs/releases/manifest.json"))
          pending = m.get("pending")
          if not pending:
              print("No pending release in manifest — nothing to publish.")
              with open(out, "a") as f:
                  f.write("skip=true\n")
                  f.write("need_nuget=false\n")
                  f.write("need_node=false\n")
              raise SystemExit(0)
          comps = pending.get("components") or {}
          published = {n: bool(c.get("publish")) for n, c in comps.items()}
          need_nuget = published.get("FSharp.PureAnalyzer") or published.get("fspure-collector")
          need_node = published.get("fsharp-pure-decorations")
          print("pending=true")
          for n, c in comps.items():
              print(n, c)
          with open(out, "a") as f:
              f.write("skip=false\n")
              f.write(f"need_nuget={'true' if need_nuget else 'false'}\n")
              f.write(f"need_node={'true' if need_node else 'false'}\n")
          PY

      - name: Setup .NET 10
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.need_node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install paket
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.need_nuget == 'true'
        run: |
          if ! command -v paket >/dev/null 2>&1; then
            dotnet tool install paket --tool-path "$HOME/.dotnet/tools"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Require NUGET_USER
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.need_nuget == 'true'
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER required for official nuget.org publish"
            exit 1
          fi

      - name: NuGet login (OIDC)
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.need_nuget == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish official packages
        if: steps.guard.outputs.skip != 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chmod +x src/scripts/release/*.sh
          bash src/scripts/release/publish-official.sh

      - name: Commit pin updates to main
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No pin updates to commit"
            exit 0
          fi
          git commit -m "chore(release): apply official version pins after publish

          Automated by Official release workflow."
          git pull --rebase origin main || true
          git push origin "HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"

      - name: Tag official skill release
        if: steps.guard.outputs.skip != 'true' && env.SKILL_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${SKILL_RELEASE_TAG}"
          VER="${SKILL_RELEASE_VER}"
          git fetch origin
          git checkout "${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"
          git pull --ff-only origin "${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "fspure-reduce-impurity $VER"
            git push origin "$TAG"
          fi
          NOTES="$(VER="$VER" python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          text = pathlib.Path("src/docs/releases/CHANGELOG.fspure-reduce-impurity.md").read_text()
          m = re.search(rf"^## \[{re.escape(ver)}\][\s\S]*?(?=^## \[|\Z)", text, re.M)
          print((m.group(0).strip() if m else f"fspure-reduce-impurity {ver}"))
          PY
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            gh release create "$TAG" --title "fspure-reduce-impurity $VER" --notes "$NOTES"
          fi

      - name: Trigger ready-lib sync + fstarter PR
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort: workflows must exist and allow workflow_dispatch
          gh workflow run "Sync fspure-ready-lib" --ref main || true
          gh workflow run "PR fspure updates to fstarter" --ref main || true

      - name: Generate stable docs + sync committed Markdown
        if: steps.guard.outputs.skip != 'true'
        id: docs
        run: |
          set -euo pipefail
          VER="$(python3 - <<'PY'
          import json
          m = json.load(open("src/docs/releases/manifest.json"))
          p = m.get("pending") or {}
          comps = (p.get("components") or {})
          a = comps.get("FSharp.PureAnalyzer") or {}
          print(a.get("to") or m["lastOfficial"]["FSharp.PureAnalyzer"])
          PY
          )"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Docs stable version=$VER → .generated/ + README.md + src/docs/EXAMPLES.md"
          dotnet run --project src/DocsGenerator -- sync-readme "$VER"
          test -d .generated/site
          test -f .generated/docs/README.md
          test -f .generated/docs/EXAMPLES.md
          test -f README.md
          test -f src/docs/EXAMPLES.md

      - name: Commit synced generated Markdown
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/docs/EXAMPLES.md
          if git diff --staged --quiet; then
            echo "Committed generated Markdown already in sync"
            exit 0
          fi
          git commit -m "docs: sync README.md and EXAMPLES.md after official release ${{ steps.docs.outputs.version }}

          Automated by Official release. Source: src/docs/human/ + templates."
          git pull --rebase origin "${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}" || true
          git push origin "HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}"

      # ONLY this step updates fspure.net (custom domain on gh-pages site root).
      # Previews live under /preview/ and are meant to be opened via e-st.github.io.
      - name: Publish fspure.net (stable site root only)
        if: steps.guard.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.generated/site
          # Keep /preview/* from Docs preview workflow; overwrite stable root files.
          keep_files: true
          cname: fspure.net
          commit_message: "docs(stable): fspure.net @ ${{ steps.docs.outputs.version }}"
