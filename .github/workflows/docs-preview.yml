# Preview docs for branches / PRs / beta tags.
#
# Published ONLY under the default GitHub Pages host:
#   https://e-st.github.io/fspure/preview/<ref>/
#
# Never updates fspure.net (custom domain). That happens only in Official release.
name: Docs preview

on:
  push:
    branches-ignore: [gh-pages, main]
    tags:
      - "*-beta*"
      - "*-rc*"
      - "*-preview*"
      - "v*-beta*"
      - "v*-rc*"
  pull_request:
  workflow_dispatch:
    inputs:
      ref_label:
        description: "Preview path label (default: branch/tag name)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate + publish preview (github.io only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve preview label
        id: ref
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.ref_label }}" ]]; then
            LABEL="${{ github.event.inputs.ref_label }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LABEL="pr-${{ github.event.pull_request.number }}"
          else
            LABEL="${{ github.ref_name }}"
          fi
          SAFE="$(echo "$LABEL" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "url=https://e-st.github.io/fspure/preview/${SAFE}/" >> "$GITHUB_OUTPUT"
          echo "Preview: $LABEL → https://e-st.github.io/fspure/preview/${SAFE}/"

      - name: Generate
        env:
          GH_PAGES_BASE: https://e-st.github.io/fspure
        run: |
          set -euo pipefail
          chmod +x src/scripts/docs-generate.sh
          bash src/scripts/docs-generate.sh preview "${{ steps.ref.outputs.label }}"
          # Index of previews (github.io only — no CNAME)
          mkdir -p .generated/site/preview
          cat > .generated/site/preview/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><title>fspure doc previews</title></head>
          <body>
            <h1>fspure documentation previews</h1>
            <p>These pages are on <strong>GitHub Pages (github.io)</strong> only.</p>
            <p>Stable product site (updated only on official release):
              <a href="https://fspure.net/">https://fspure.net/</a></p>
            <p>This run:
              <a href="./${{ steps.ref.outputs.safe }}/">./${{ steps.ref.outputs.safe }}/</a></p>
          </body></html>
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-${{ steps.ref.outputs.safe }}
          path: .generated/site/preview
          if-no-files-found: error

      # PRs: artifact only (no publish). Pushes/tags/dispatch: publish under preview/ on gh-pages.
      - name: Publish preview path to gh-pages (no custom domain)
        if: github.event_name != 'pull_request' && github.repository == 'e-St/fspure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publish only the preview tree — never touch site root / CNAME / fspure.net content.
          publish_dir: ./.generated/site/preview
          destination_dir: preview
          keep_files: true
          allow_empty_commit: true
          # Explicitly do not set cname — previews must not claim fspure.net.
          commit_message: "docs(preview): ${{ steps.ref.outputs.safe }} → e-st.github.io only"

      - name: Summary
        run: |
          echo "### Docs preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**github.io (use this):** ${{ steps.ref.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "fspure.net is **not** updated by this workflow." >> "$GITHUB_STEP_SUMMARY"
