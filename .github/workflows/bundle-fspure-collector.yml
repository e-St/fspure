name: Bundle fspure-collector

on:
  push:
    branches: [main]
    paths:
      - "src/fspure-collector/**"
      - "src/FSharp.PureSchema/**"
      - "src/tests/FSharp.PureSchema.Tests/**"
      - "src/tests/fixtures/**"
      - "src/devcontainer/fragments/**"
      - "src/DevcontainerGen/**"
      - ".github/workflows/bundle-fspure-collector.yml"
      - ".github/workflows/devcontainer-flavours.yml"
  pull_request:
    paths:
      - "src/fspure-collector/**"
      - "src/FSharp.PureSchema/**"
      - "src/tests/FSharp.PureSchema.Tests/**"
      - "src/tests/fixtures/**"
      - "src/devcontainer/fragments/**"
      - "src/DevcontainerGen/**"
      - ".github/workflows/bundle-fspure-collector.yml"
      - ".github/workflows/devcontainer-flavours.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  generate-devcontainer-flavours:
    uses: ./.github/workflows/devcontainer-flavours.yml

  bundle:
    needs: generate-devcontainer-flavours
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply generated devcontainer flavours
        uses: ./.github/actions/apply-devcontainer-flavours

      - name: Log in to GHCR (devcontainer image)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and bundle fspure-collector in the build devcontainer
        uses: devcontainers/ci@v0.3
        with:
          # Shared fstarter build image (defined with PureAnalyzer; no IDE setup)
          configFile: src/FSharp.PureAnalyzer/.devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            export TMPDIR="$HOME/.nuget-tmp"
            mkdir -p "$TMPDIR"
            cd src/fspure-collector
            paket install
            BINARY_PATH=$(bundlef -p | tail -n 1)
            echo "Binary: $BINARY_PATH"
            ls -lh "$BINARY_PATH"
            # monorepo root artifacts/ (two levels up from src/fspure-collector)
            mkdir -p ../../artifacts
            cp "$BINARY_PATH" ../../artifacts/fspure-collector
            chmod +x ../../artifacts/fspure-collector
            ../../artifacts/fspure-collector --help

      - name: Upload fspure-collector artifact
        uses: actions/upload-artifact@v7
        with:
          name: fspure-collector-linux-x64
          path: artifacts/fspure-collector
          if-no-files-found: error

      - name: Publish release asset on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: fspure-collector-latest
          name: fspure-collector (latest standalone)
          files: artifacts/fspure-collector
          prerelease: true
          generate_release_notes: false
          body: |
            Standalone `fspure-collector` linux-x64 single-file executable, built with `bundlef`
            inside the project's devcontainer (ghcr.io/e-st/fstarter).
            Note: as a self-contained single-file bundle, its managed assemblies are embedded
            rather than present as loose files, so `--defaults` assembly auto-discovery does not
            apply to the bundle itself. Pass explicit `--assembly <path>...` when running it
            standalone. The monthly List A workflow instead runs fspure-collector from source via
            `dotnet run` inside the same devcontainer, where auto-discovery works.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
