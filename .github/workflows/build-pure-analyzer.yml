name: Build Pure Analyzer

on:
  push:
    branches: [main]
    paths:
      - "FSharp.PureAnalyzer/**"
      - "schema/FSharp.PureSchema/**"
      - ".devcontainer/fragments/**"
      - ".devcontainer/generate.py"
      - ".github/workflows/build-pure-analyzer.yml"
      - ".github/workflows/devcontainer-flavours.yml"
  pull_request:
    paths:
      - "FSharp.PureAnalyzer/**"
      - "schema/FSharp.PureSchema/**"
      - ".devcontainer/fragments/**"
      - ".devcontainer/generate.py"
      - ".github/workflows/build-pure-analyzer.yml"
      - ".github/workflows/devcontainer-flavours.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  generate-devcontainer-flavours:
    uses: ./.github/workflows/devcontainer-flavours.yml

  build:
    needs: generate-devcontainer-flavours
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply generated devcontainer flavours
        uses: ./.github/actions/apply-devcontainer-flavours

      - name: Log in to GHCR (devcontainer image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pure Analyzer inside the build devcontainer
        uses: devcontainers/ci@v0.3
        with:
          # PureAnalyzer build container — not the root fspure IDE .devcontainer
          configFile: FSharp.PureAnalyzer/.devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -euo pipefail
            export TMPDIR="$HOME/.nuget-tmp"
            mkdir -p "$TMPDIR"
            # Phase 1: analyser depends on shared PureSchema (ProjectReference)
            dotnet build schema/FSharp.PureSchema/FSharp.PureSchema.fsproj -c Release --nologo
            cd FSharp.PureAnalyzer
            paket restore
            dotnet build -c Release
