<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fspure</title>
  <meta name="description" content="F# analyzer and VS Code extension that help you push impurity to the boundary of your application." />
  <link rel="icon" href="fspure.png" type="image/png" />
  <style>
    :root {
      color-scheme: light;
      --sky-top: #f0d9b5;
      --sky-mid: #f6e6c8;
      --sand: #f3e2c4;
      --dune: #e8c99a;
      --dune-deep: #d4a574;
      --text: #4a3428;
      --muted: #7a5c45;
      --link: #2f6b4f;
      --link-hover: #1f4d38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2rem 1.25rem 4rem;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      text-align: center;
      line-height: 1.5;
      background:
        radial-gradient(ellipse 120% 60% at 50% 100%, var(--dune) 0%, transparent 55%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sand) 70%, var(--dune) 100%);
    }

    /* Soft horizon dunes */
    body::before {
      content: "";
      position: fixed;
      inset: auto 0 0;
      height: 28vh;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 100% at 20% 120%, var(--dune-deep) 0%, transparent 60%),
        radial-gradient(ellipse 90% 100% at 75% 130%, #c9956a 0%, transparent 55%),
        radial-gradient(ellipse 100% 80% at 50% 140%, #b87d52 0%, transparent 50%);
      opacity: 0.45;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .logo {
      width: min(420px, 88vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 24px rgba(74, 52, 40, 0.18));
    }

    .tagline {
      max-width: 28rem;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .tagline em {
      font-style: normal;
      color: var(--text);
      font-weight: 600;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.35rem;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 500;
    }

    a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--link-hover);
      border-bottom-color: currentColor;
      outline: none;
    }

    footer {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="fspure.png" alt="fspure" width="2012" height="606" />
    <p class="tagline">
      F# analyzer &amp; VS Code extension to push
      <em>impurity</em> to the boundary of your application.
    </p>
    <nav class="links" aria-label="Project links">
      <a href="https://github.com/e-St/fspure">GitHub</a>
      <a href="https://github.com/e-St/fspure#consume-fspure-end-users">Get started</a>
      <a href="https://github.com/e-St/fspure/releases">Releases</a>
    </nav>
    <footer>Open source · MIT</footer>
  </main>
</body>
</html>
